name: demo

# builds the web models from the stanford scans, the smithsonian's washington and the
# khronos fox, and publishes web/ to github pages, so the live demo runs the repository's
# code.
on:
  push:
    branches: [main]
    paths: ['src/**', 'include/**', 'tools/**', 'web/**', 'models/fetch.sh', 'Makefile', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the web models take about two hours here (proving the error bounds), so they are kept
      # between runs and built again only when the builder's sources change.
      - name: Cache the web models
        id: models
        uses: actions/cache@v4
        with:
          path: web/models
          key: web-models-${{ hashFiles('src/**', 'include/**', 'tools/**', 'web/build.sh', 'web/split.py', 'Makefile') }}
      - name: Build the builder
        if: steps.models.outputs.cache-hit != 'true'
        run: make -j"$(nproc)" colossus_build
      # scans are 380 mb from stanford: cache them between runs.
      - uses: actions/cache@v4
        if: steps.models.outputs.cache-hit != 'true'
        with:
          path: |
            models/lucy.ply
            models/xyzrgb_dragon.ply
          key: stanford-scans-v1
      # washington's texture is a jpeg, converted with ffmpeg.
      - name: Install ffmpeg
        if: steps.models.outputs.cache-hit != 'true'
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Download the scans
        if: steps.models.outputs.cache-hit != 'true'
        run: models/fetch.sh --download-only dragon lucy washington fox
      - name: Build the web models
        if: steps.models.outputs.cache-hit != 'true'
        run: web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
